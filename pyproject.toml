[project]
name = "my-go"
version = "0.1.0"
description = "Kaya Go board recognition FastAPI service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[all]>=0.141.1",
    "maturin>=1.14.1",
    "numpy>=2.4.6",
    "onnxruntime>=1.28.0",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
]

# 使 `src/kaya_go` 作为 my_go 的顶层包可被导入
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kaya_go"]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
